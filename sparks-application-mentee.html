<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SPARKS Mentee Application | Homegrown Arts &amp; Media Collective</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Karla:wght@400;700&family=Poppins:wght@400;800&display=swap" rel="stylesheet">
<style>
/* VOICE: bold, warm, direct; the SPARKS campaign's own voice, applied to an application people take their time with
   IDEA: the campaign carousel, continued. Each question is the next slide; a coral starburst marks progress
   PICTURE: the halftone dark ground and coral starburst from the campaign boards, with the progress star moving along a rule
   COLOUR and TYPE: #141414 halftone, white ink, coral #e87a6b lead, gold #fcbc2e support; Poppins 800 caps headlines, Karla labels and body
   LAYOUT: one question per screen, rounded blocks, solid coral callouts, review before send */
:root{color-scheme:dark;--bg:#141414;--card:#1c1c1c;--card2:#232323;--ink:#fff;--soft:#c9cfcf;--mut:#9ba7a7;--line:#353535;--acc:#e87a6b;--gold:#fcbc2e;--err:#ff9d8f;--r:14px;--r-sm:10px;--pill:999px}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;min-height:100%}
body{background:var(--bg) radial-gradient(circle,rgba(255,255,255,.08) 1.3px,transparent 1.7px) 0 0/9px 9px fixed;color:var(--ink);font:17px/1.55 Karla,'Helvetica Neue',system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:clip}
.burst{position:fixed;z-index:0;pointer-events:none;fill:var(--acc);opacity:.16}
.burst.a{width:min(70vw,620px);right:-18vw;top:-10vh}
.burst.b{width:min(60vw,520px);left:-22vw;bottom:-14vh;opacity:.1}
h1,h2,.disp{font-family:Poppins,'Helvetica Neue',sans-serif;font-weight:800;line-height:1;letter-spacing:-.03em;text-transform:uppercase;text-wrap:balance;margin:0}
h2{font-size:clamp(28px,5vw,44px)}
p{margin:0}
.lbl{font:700 14px Karla,sans-serif;letter-spacing:.09em;text-transform:uppercase;color:var(--mut)}
.wrap{position:relative;z-index:1;max-width:700px;margin:0 auto;padding:0 max(5vw,18px)}
header.top{position:sticky;top:0;z-index:20;background:linear-gradient(var(--bg) 72%,rgba(20,20,20,0));padding:18px 0 20px}
.brand{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}
.brand img{height:30px;width:auto;display:block}
.fuse{position:relative;height:22px}
.fuse .rail{position:absolute;left:0;right:0;top:10px;height:2px;background:var(--line);border-radius:var(--pill)}
.fuse .burn{position:absolute;left:0;top:9px;height:4px;background:var(--acc);border-radius:var(--pill);transition:width .5s ease}
.fuse .ember{position:absolute;top:0;width:22px;height:22px;margin-left:-11px;fill:var(--acc);transition:left .5s ease}
.chaps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin-top:6px}
.chaps span{font:700 13px Karla,'Helvetica Neue',Arial,sans-serif;letter-spacing:.09em;text-transform:uppercase;color:#6f7878}
.chaps span:nth-child(2){text-align:center}.chaps span:nth-child(3){text-align:right}
.chaps .on{color:var(--acc)}
main{position:relative;z-index:1;padding:14px 0 130px}
.screen.enter{animation:rise .35s ease both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
.qno{margin-bottom:14px}
.qno b{color:var(--acc)}
.sub{color:var(--soft);margin-top:14px;max-width:60ch;font-size:18px}
.stack{display:grid;gap:20px;margin-top:30px}
label.f{display:grid;gap:8px;font-weight:700}
label.f small{color:var(--mut);font-weight:400}
.req{color:var(--acc)}
input[type=text],input[type=email],input[type=tel],input[type=url],textarea{width:100%;font:17px/1.5 Karla,sans-serif;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:var(--r-sm);padding:14px 16px;outline:none;transition:border-color .2s}
textarea{min-height:150px;resize:vertical}
input:focus,textarea:focus{border-color:var(--acc)}
input::placeholder,textarea::placeholder{color:#6f7878}
.bad{border-color:var(--err)!important}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:700 15px Karla,sans-serif;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:var(--pill);padding:10px 16px;min-height:44px;cursor:pointer;transition:all .15s}
.chip:hover{border-color:#5a5a5a}
.chip.on,.chip.have{border-color:var(--acc);color:var(--acc);background:rgba(232,122,107,.1)}
.chip.star{background:var(--acc);border-color:var(--acc);color:#141414}
.chip.need{border-color:var(--gold);color:var(--gold);background:rgba(252,188,46,.08)}
.cards{display:grid;gap:12px;margin-top:30px}
.cards.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.card{text-align:left;font:inherit;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:20px 22px;cursor:pointer;min-height:64px;transition:all .15s}
.card:hover{border-color:#5a5a5a;background:var(--card2)}
.card b{display:block;font:800 22px/1.1 Poppins,sans-serif;letter-spacing:-.02em;text-transform:uppercase}
.card span{display:block;color:var(--soft);font-size:16px;margin-top:6px}
.card.on{border-color:var(--acc);background:var(--acc);color:#141414}
.card.on span{color:#2a1512}
.track{position:relative;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));margin-top:36px}
.track::before{content:"";position:absolute;left:10%;right:10%;top:15px;height:2px;background:var(--line)}
.stop{position:relative;background:none;border:0;color:var(--soft);font:700 15px/1.3 Karla,'Helvetica Neue',Arial,sans-serif;cursor:pointer;display:grid;justify-items:center;gap:10px;padding:0 2px;min-height:44px;text-align:center}
.stop i{width:32px;height:32px;background:var(--card);border:2px solid var(--line);border-radius:6px;transition:all .2s;transform:rotate(45deg) scale(.75)}
.stop.on{color:var(--acc)}.stop.on i{background:var(--acc);border-color:var(--acc)}
.stop.past i{border-color:var(--acc);background:#3a211d}
.grid{display:grid;gap:10px;margin-top:28px}
.row{display:grid;grid-template-columns:104px minmax(0,1fr);gap:10px;align-items:center;background:var(--card);border:2px solid var(--line);border-radius:var(--r-sm);padding:10px 12px}
.row.bad{border-color:var(--err)}
.row b{font:800 15px Poppins,'Helvetica Neue',Arial,sans-serif;text-transform:uppercase;letter-spacing:-.01em}
.row .chips{gap:6px}.row .chip{padding:8px 12px;font-size:14px;min-height:40px}
.link{background:none;border:0;color:var(--acc);font:700 16px Karla,'Helvetica Neue',Arial,sans-serif;cursor:pointer;padding:12px 0;text-decoration:underline;text-underline-offset:4px}
.legend{display:flex;flex-wrap:wrap;gap:16px;color:var(--soft);font-size:15px;margin-top:14px}
.legend i{display:inline-block;width:12px;height:12px;margin-right:7px;vertical-align:-1px}
.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
nav.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:linear-gradient(rgba(20,20,20,0),var(--bg) 38%);padding:30px 0 18px}
nav.bar .wrap{display:flex;gap:12px;align-items:center}
.btn{font:800 17px Poppins,sans-serif;text-transform:uppercase;letter-spacing:-.01em;border:2px solid var(--acc);border-radius:var(--pill);padding:14px 28px;min-height:54px;cursor:pointer;background:var(--acc);color:#141414;transition:transform .15s,background .2s;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{background:#f08e80}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--ink)}
.btn[disabled]{opacity:.5;cursor:wait}
.grow{flex:1}
.msg{color:var(--err);font-size:16px;font-weight:700;margin-top:16px;min-height:1px}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
/* intro */
.hero{position:relative;padding:28px 0 10px;container-type:inline-size;width:100%}
.hero .logo{width:200px;height:auto;display:block}
.hero .top2{display:flex;justify-content:space-between;align-items:center;gap:16px}
.word{font:800 clamp(78px,20vw,168px)/.9 Poppins,sans-serif;letter-spacing:-.04em;color:var(--acc);margin:clamp(56px,10vh,110px) 0 0;text-transform:uppercase;font-size:min(168px,23.5cqi);white-space:nowrap}
.kick{margin-top:clamp(40px,8vh,80px)}
.lede{font:400 clamp(20px,3vw,26px)/1.35 Poppins,sans-serif;margin-top:16px;max-width:30ch}
.callout{background:var(--acc);color:#141414;border-radius:var(--r);padding:24px 28px;margin-top:30px;font-weight:700;font-size:18px}
.callout p+p,.callout ul{margin-top:10px}
.callout ul{padding-left:20px;margin-bottom:0}
.callout li{margin:4px 0}
.facts{display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:24px}
.facts b{color:var(--ink)}
/* review */
.rev{margin-top:28px;display:grid;gap:24px}
.rev section{border-top:2px solid var(--line);padding-top:18px}
.rev h3{font:800 22px Poppins,'Helvetica Neue',Arial,sans-serif;text-transform:uppercase;letter-spacing:-.02em;margin:0 0 12px;color:var(--acc)}
.rev dl{margin:0;display:grid;gap:14px}
.rev dt{display:flex;justify-content:space-between;align-items:center;gap:10px}
.rev dt button{background:none;border:0;color:var(--acc);font:700 15px Karla,'Helvetica Neue',Arial,sans-serif;cursor:pointer;padding:0 4px;min-height:36px;text-decoration:underline;text-underline-offset:3px}
.rev dd{margin:2px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.rev dd.empty{color:var(--mut);font-style:italic}
/* done */
.spark-card{position:relative;overflow:hidden;margin-top:28px;padding:32px 30px 30px;background:var(--acc);color:#141414}
.spark-card svg{position:absolute;right:-70px;top:-70px;width:260px;fill:#141414;opacity:.12}
.spark-card .lbl{color:#3d1d18}
.spark-card .nm{font:800 clamp(40px,8vw,64px)/.95 Poppins,'Helvetica Neue',Arial,sans-serif;letter-spacing:-.03em;text-transform:uppercase;margin:12px 0 16px;position:relative}
.spark-card .meta{display:flex;flex-wrap:wrap;gap:8px;position:relative}
.spark-card .meta span{background:#141414;color:#fff;padding:6px 12px;font-weight:700;font-size:15px}
.spark-card q{display:block;margin-top:18px;font:400 18px/1.4 Poppins,'Helvetica Neue',Arial,sans-serif;position:relative;quotes:"C" "D"}
.fallback{margin-top:24px;background:var(--card);border:2px solid var(--gold);padding:20px 22px}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--ink);color:#141414;padding:10px 18px;font-weight:700;font-size:15px;z-index:70;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.on{opacity:1}
@media(max-width:600px){.cards.two,.cols{grid-template-columns:minmax(0,1fr)}.row{grid-template-columns:minmax(0,1fr)}.track{grid-template-columns:minmax(0,1fr);gap:4px}.track::before{left:15px;right:auto;top:16px;bottom:16px;width:2px;height:auto}.stop{grid-template-columns:32px minmax(0,1fr);justify-items:start;text-align:left;align-items:center;gap:14px;padding:4px 0}.burst.a{right:-40vw}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

 {id:'elig',ch:1,kind:'choice',k:'elig',title:'Are you in your final year of post-secondary, or your first 5 years of making art or learning your craft?',opts:[['Yes'],['No']],two:1},
 {id:'avail',ch:1,kind:'choice',k:'avail',title:'Can you join a cohort in March or August 2027, and commit at least 4 hours a month?',sub:'That’s about 1 hour a week. If not, please still apply. More cohorts are being planned.',opts:[['Yes'],['No']],two:1},
 {id:'travel',ch:1,kind:'text',k:'travel',title:'Any travel plans or prior commitments during those periods?',sub:'If you said yes, tell us when and for how long.',chips:['None that I know of'],short:1},
 {id:'sched',ch:1,kind:'grid',title:'When are you usually free?',sub:'Tap every time that works on each day. Not sure? Make your best guess, we can follow up later. If you can’t make those months, choose “Doesn’t work for me” on each day.'},
 {id:'areas',ch:2,kind:'media',title:'What do you love to make?',sub:'Tap everything you’re into. Tap again to make it a primary focus.'},
 {id:'concept',ch:2,kind:'text',k:'concept',title:'What’s the concept of your current project?',sub:'A brief summary of the idea.'},
 {id:'phase',ch:2,kind:'phase',title:'Where is your project right now?'},
 {id:'next',ch:2,kind:'paths',title:'What’s next, or where are you feeling stuck?',sub:'Tap any that fit, then tell us in your own words. Elaborate as much as you want.'},
 {id:'goal',ch:2,kind:'text',k:'goal',title:'What’s your dream result for this project?',sub:'Getting published, reaching a particular audience, a gallery or festival, inspiring others…'},
 {id:'kit',ch:2,kind:'kit',title:'What’s in your kit?',sub:'Tap once for “have”, twice for “need”. Add anything else below.'},
 {id:'port',ch:2,kind:'fields',title:'Show us your art!',sub:'Optional, but it helps us get to know you beyond words.',fields:[{k:'port',label:'Portfolio link, work sample or social handle',opt:1,ac:'url'}]},
 {id:'prior',ch:3,kind:'text',k:'prior',title:'Have you had a mentor or been part of a mentorship program before?',sub:'If yes, which program, and what did you value most about it?',chips:['No, this would be my first']},
 {id:'ideal',ch:3,kind:'text',k:'ideal',title:'Who is your ideal mentor?',sub:'Personality traits, gender, ethnicity, or anything that helps you learn best and feel safe.',chips:TRAITS,multi:1},
 {id:'mtype',ch:3,kind:'choice',k:'mtype',title:'Which would you like?',opts:[['4-month mentorship','A cohort running March–June or August–November'],['Learning set','Being mentored on a learning set in February']],two:1},
 {id:'fmt',ch:3,kind:'choice',k:'fmt',title:'How would you like to meet?',opts:[['Online'],['In person'],['Hybrid of online/in person']]},
 {id:'needs',ch:3,kind:'text',k:'needs',title:'Anything else that helps you do your best work?',sub:'Your learning style (how you like feedback), what helps you focus, and any language needs, sensitivities, allergies, or disabilities that need accessibility support.',chips:['Nothing else for now']},
 {id:'news',ch:3,kind:'choice',k:'news',title:'Homegrown is intentional with your information.',sub:'Want to keep hearing about programs built with creatives like you in mind?',opts:NEWS.map(x=>[x])},
 {id:'review',ch:4},{id:'done',ch:5}
];
const FIELDS=S.filter(s=>s.kind).length;

let A={media:{},kit:{},paths:[],sched:{}},i=0,attempted=false,sent=false;
const store={get(){try{return JSON.parse(localStorage.getItem('sparks-mentee-draft')||'null')}catch(e){return null}},set(){try{localStorage.setItem('sparks-mentee-draft',JSON.stringify({A,i}))}catch(e){}},clear(){try{localStorage.removeItem('sparks-mentee-draft')}catch(e){}}};
const saved=store.get();
if(saved&&saved.A){A=Object.assign(A,saved.A)}

const $=id=>document.getElementById(id), stage=$('stage');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const tval=k=>(A[k]||'').trim();
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2200)}

/* composed answers sent to the form */
function areasText(){const p=[],o=[];for(const m of MEDIA){if(A.media[m]===2)p.push(m);else if(A.media[m]===1)o.push(m)}
  const ex=tval('mediaOther');const out=[];if(p.length)out.push('Primary: '+p.join(', '));if(o.length)out.push('Also: '+o.join(', '));if(ex)out.push('Other: '+ex);return out.join('. ')}
function kitText(st,extraK){const l=KIT.filter(x=>A.kit[x]===st);const ex=tval(extraK);if(ex)l.push(ex);return l.join(', ')}
function nextText(){const t=tval('next');const p=A.paths.length?'Ready to: '+A.paths.join('; ')+'.':'';return [p,t].filter(Boolean).join('\n\n')}
function phaseText(){return A.phase==='__other'?tval('phaseOther'):(A.phase||'')}

function valid(s){
  switch(s.kind){
   case 'fields':return s.fields.every(f=>f.opt||(tval(f.k)&&(f.type!=='email'||/^\S+@\S+\.\S+$/.test(tval(f.k)))));
   case 'choice':return !!A[s.k];
   case 'text':return !!tval(s.k);
   case 'grid':return DAYS.every(([d])=>(A.sched[d]||[]).length);
   case 'media':return !!areasText();
   case 'phase':return !!phaseText();
   case 'paths':return !!tval('next');
   case 'kit':return !!kitText('have','haveX')&&!!kitText('need','needX');
   default:return true}
}
const MSG={fields:'Fill in the highlighted fields to keep going.',choice:'Pick one to keep going.',text:'Add a few words to keep going.',grid:'Every day needs at least one choice.',media:'Tap at least one, or add your own.',phase:'Pick a stage, or describe your own.',paths:'Tell us in your own words, even a sentence helps.',kit:'Add at least one thing you have and one you need. Writing “none” is fine.'};

function header(s){const n=S.filter(x=>x.kind).indexOf(s)+1;return `<p class="qno lbl"><b>${String(n).padStart(2,'0')}</b> / ${FIELDS}</p><h2 id="q">${esc(s.title)}</h2>${s.sub?`<p class="sub">${esc(s.sub)}</p>`:''}`}
function chipRow(list,k,multi){return `<div class="chips">${list.map(c=>`<button type="button" class="chip" data-act="fill" data-k="${k}" data-v="${esc(c)}" data-multi="${multi?1:''}">${esc(c)}</button>`).join('')}</div>`}

function render(){
  const s=S[i];attempted=false;
  $('top').hidden=$('bar').hidden=(s.id==='intro'||s.id==='done');
  updateFuse();
  let h='';
  if(s.id==='intro')h=intro();
  else if(s.id==='review')h=review();
  else if(s.id==='done')h=done();
  else switch(s.kind){
   case 'fields':h=header(s)+`<div class="stack">${s.fields.map(f=>`<label class="f">${esc(f.label)}${f.req?' <span class="req" aria-hidden="true">*</span>':''}${f.opt?' <small>Optional</small>':''}<input id="f-${f.k}" type="${f.type||'text'}" data-k="${f.k}" autocomplete="${f.ac||'off'}" value="${esc(A[f.k])}" ${f.req?'required':''}></label>${f.chips?chipRow(f.chips,f.k):''}`).join('')}</div>`;break;
   case 'choice':h=header(s)+`<div class="cards ${s.two?'two':''}" role="radiogroup" aria-labelledby="q">${s.opts.map(([o,d])=>`<button type="button" role="radio" aria-checked="${A[s.k]===o}" class="card ${A[s.k]===o?'on':''}" data-act="pick" data-k="${s.k}" data-v="${esc(o)}"><b>${esc(o)}</b>${d?`<span>${esc(d)}</span>`:''}</button>`).join('')}</div>`;break;
   case 'text':h=header(s)+`<div class="stack"><textarea id="f-${s.k}" data-k="${s.k}" aria-labelledby="q" ${s.short?'style="min-height:110px"':''}>${esc(A[s.k])}</textarea>${s.chips?chipRow(s.chips,s.k,s.multi):''}</div>`;break;
   case 'grid':h=header(s)+`<div class="grid">${DAYS.map(([d])=>`<div class="row" data-day="${d}"><b>${d}</b><div class="chips">${SLOTS.map(t=>`<button type="button" class="chip ${(A.sched[d]||[]).includes(t)?'on':''}" data-act="slot" data-d="${d}" data-v="${esc(t)}" aria-pressed="${(A.sched[d]||[]).includes(t)}">${t==="Doesn't work for me"?'Doesn’t work':t}</button>`).join('')}</div></div>`).join('')}</div><button type="button" class="link" data-act="copymon">Copy Monday to every day</button>`;break;
   case 'media':h=header(s)+`<div class="stack"><div class="chips">${MEDIA.map(m=>{const v=A.media[m]||0;return `<button type="button" class="chip ${v===1?'on':v===2?'star':''}" data-act="media" data-v="${m}">${v===2?'★ ':''}${m}</button>`}).join('')}</div><div class="legend"><span><i style="border:2px solid var(--acc)"></i>Interested</span><span><i style="background:var(--acc)"></i>Primary focus</span></div><label class="f">Something else? <small>Optional</small><input type="text" data-k="mediaOther" value="${esc(A.mediaOther)}" placeholder="Podcasting, animation, poetry…"></label></div>`;break;
   case 'phase':{const ix=PHASES.indexOf(A.phase);h=header(s)+`<div class="track" role="radiogroup" aria-labelledby="q">${PHASES.map((p,n)=>`<button type="button" role="radio" aria-checked="${A.phase===p}" class="stop ${A.phase===p?'on':ix>n?'past':''}" data-act="pick" data-k="phase" data-v="${p}"><i></i>${p.replace('/','/<wbr>')}</button>`).join('')}</div><div class="stack"><button type="button" class="chip ${A.phase==='__other'?'on':''}" style="justify-self:start" data-act="pick" data-k="phase" data-v="__other">Something else</button>${A.phase==='__other'?`<input type="text" data-k="phaseOther" id="f-phaseOther" value="${esc(A.phaseOther)}" placeholder="Describe where it’s at">`:''}</div>`;break}
   case 'paths':h=header(s)+`<div class="cards">${PATHS.map(([t,d])=>`<button type="button" class="card ${A.paths.includes(t)?'on':''}" aria-pressed="${A.paths.includes(t)}" data-act="path" data-v="${t}"><b>${t}</b><span>${d}</span></button>`).join('')}</div><div class="stack"><label class="f">In your own words <span class="req" aria-hidden="true">*</span><textarea id="f-next" data-k="next">${esc(A.next)}</textarea></label></div>`;break;
   case 'kit':h=header(s)+`<div class="stack"><div class="chips">${KIT.map(x=>{const v=A.kit[x];return `<button type="button" class="chip ${v||''}" data-act="kit" data-v="${x}">${v==='have'?'✓ ':v==='need'?'+ ':''}${x}</button>`}).join('')}</div><div class="legend"><span><i style="background:var(--acc)"></i>Have</span><span><i style="background:var(--gold)"></i>Need</span></div><div class="cols"><label class="f">Anything else you have<textarea data-k="haveX" style="min-height:100px">${esc(A.haveX)}</textarea></label><label class="f">Anything else you need<textarea data-k="needX" style="min-height:100px">${esc(A.needX)}</textarea></label></div></div>`;break;
  }
  if(s.kind)h+=`<p class="msg" id="msg" role="alert"></p>`;
  stage.innerHTML=`<div class="screen${render.last!==i?' enter':''}">${h}</div>`;const moved=render.last!==i;render.last=i;
  $('next').textContent=s.id==='review'?'Send my application':'Next';
  if(!moved)return store.set();
  window.scrollTo({top:0});
  const first=stage.querySelector('input,textarea');if(first&&matchMedia('(hover:hover)').matches)first.focus({preventScroll:true});
  store.set();
}

function intro(){
  const resume=saved&&saved.i>0&&!sent;
  return `<div class="screen enter hero"><div class="top2"><img class="logo" src="${LOGO}" alt="Homegrown Arts &amp; Media Collective"><span class="lbl">Mentee application</span></div>
  <p class="lbl kick" style="color:var(--soft)">SPARKS 2027</p>
  <h1 class="word" style="margin-top:10px">Sparks</h1>
  <p class="lede">A working mentor. A real project. Take your story from idea to finished.</p>
  <p class="sub">Strategic Pathways for Artists to Rise with Knowledge &amp; Support: a no-cost, project-based mentorship from Homegrown Arts &amp; Media Collective for creative storytellers in and around Calgary.</p>
  <div class="callout"><p>Apply if you:</p><ul><li>Are a creative storyteller: writer, filmmaker, photographer, digital creator and more</li><li>Have a current creative project you’re eager to see become a reality</li><li>Are a post-secondary student about to graduate, or began your craft in the last 5 years</li><li>Live in or around Calgary, Alberta</li></ul></div>
  <div class="facts lbl"><span><b>3</b> parts</span><span><b>${FIELDS}</b> questions</span><span>Progress saves on this device</span></div>
  <p class="sub">Take the time you need. The detail in your answers helps us match you with the right mentor and support your vision. Questions? Email <b style="color:var(--ink)">${CONTACT}</b>.</p>
  <div style="display:flex;flex-wrap:wrap;gap:12px;margin-top:30px"><button class="btn" data-act="start" type="button">${resume?'Pick up where you left off':'Start my application'} →</button>${resume?'<button class="btn ghost" data-act="restart" type="button">Start over</button>':''}</div></div>`;
}

function rows(){return [
 ['You',[['Email',tval('email'),'contact'],['Name',tval('name'),'contact'],['Preferred name',tval('pref'),'contact'],['Pronouns',tval('pron'),'contact'],['Phone',tval('phone'),'contact'],['Postal code',tval('postal'),'contact'],['Final year or first 5 years',A.elig,'elig'],['Available March or August 2027',A.avail,'avail'],['Travel or commitments',tval('travel'),'travel'],['Weekly availability',DAYS.map(([d])=>d.slice(0,3)+': '+(A.sched[d]||[]).join(', ')).join('\n'),'sched']]],
 ['Your craft',[['Areas of interest',areasText(),'areas'],['Project concept',tval('concept'),'concept'],['Current phase',phaseText(),'phase'],['Next steps',nextText(),'next'],['Dream result',tval('goal'),'goal'],['Materials you have',kitText('have','haveX'),'kit'],['Materials you need',kitText('need','needX'),'kit'],['Portfolio',tval('port'),'port']]],
 ['The mentorship',[['Previous mentorship',tval('prior'),'prior'],['Ideal mentor',tval('ideal'),'ideal'],['Mentorship type',A.mtype,'mtype'],['Meeting format',A.fmt,'fmt'],['Other needs',tval('needs'),'needs'],['Future updates',A.news,'news']]]]}
function review(){
  return `<h2>Check it over.</h2><p class="sub">Look everything over. Nothing is sent until you tap “Send my application”.</p><div class="rev">${rows().map(([t,list])=>`<section><h3>${t}</h3><dl>${list.map(([l,v,id])=>`<div><dt>${l}<button type="button" data-act="goto" data-v="${id}">Edit</button></dt><dd class="${v?'':'empty'}">${v?esc(v):'Skipped'}</dd></div>`).join('')}</dl></section>`).join('')}</div><div id="fb"></div>`;
}
function done(){
  const nm=tval('pref')||tval('name').split(' ')[0]||'You';
  const prim=MEDIA.filter(m=>A.media[m]===2);const med=(prim.length?prim:MEDIA.filter(m=>A.media[m])).slice(0,3);
  const c=tval('concept');const snip=c.length>140?c.slice(0,137).trim()+'…':c;
  return `<div class="screen enter" style="padding-top:28px"><p class="qno lbl"><b>Application sent</b></p><h2>You’re in the running.</h2><p class="sub">Thanks for taking the time. You’ll receive a follow-up email with important next steps. If it hasn’t arrived within 24 hours, email <b style="color:var(--ink)">${CONTACT}</b>.</p>
  <div class="spark-card"><svg viewBox="0 0 200 200" aria-hidden="true">${STAR}</svg><p class="lbl">SPARKS 2027 applicant</p><p class="nm">${esc(nm)}</p><div class="meta">${med.map(m=>`<span>${esc(m)}</span>`).join('')}${phaseText()?`<span>${esc(phaseText())}</span>`:''}</div>${snip?`<q>${esc(snip)}</q>`:''}</div>
  <div style="display:flex;flex-wrap:wrap;gap:12px;margin-top:22px"><button class="btn" type="button" data-act="share">Copy a note to share</button><button class="btn ghost" type="button" data-act="again">Back to start</button></div>
  <p class="sub">Know another storyteller who should apply? Send them this page.</p></div>`;
}

function updateFuse(){
  const s=S[i];const n=S.filter(x=>x.kind).indexOf(s)+1;
  const pct=s.id==='review'?100:Math.max(0,(n-1)/FIELDS*100);
  $('burn').style.width=pct+'%';$('ember').style.left=pct+'%';
  $('count').textContent=s.id==='review'?'Review':`SPARKS 2027 · Part ${s.ch} of 3`;
  [...$('chaps').children].forEach((c,k)=>c.classList.toggle('on',k+1===s.ch||(s.id==='review')));
}

function showErr(){
  const s=S[i];attempted=true;$('msg').textContent=MSG[s.kind]||'';
  if(s.kind==='fields')s.fields.forEach(f=>{const e=$('f-'+f.k);if(e)e.classList.toggle('bad',!f.opt&&!valid({kind:'fields',fields:[f]}))});
  if(s.kind==='text')$('f-'+s.k).classList.add('bad');
  if(s.kind==='paths')$('f-next').classList.add('bad');
  if(s.kind==='grid')stage.querySelectorAll('.row').forEach(r=>r.classList.toggle('bad',!(A.sched[r.dataset.day]||[]).length));
  const b=stage.querySelector('.bad');if(b)b.scrollIntoView({block:'center',behavior:'smooth'});
}
function go(n){i=Math.max(0,Math.min(S.length-1,n));render()}
function next(){
  const s=S[i];
  if(s.id==='review')return submit();
  if(!valid(s))return showErr();
  if(A._return){const r=A._return;delete A._return;return go(r)}
  go(i+1);
}

function payload(){
  const p=new URLSearchParams();const e=(id,v)=>{if(v)p.append('entry.'+id,v)};
  p.append('emailAddress',tval('email'));
  e(1375117012,tval('name'));e(63822322,tval('pref'));e(1089066798,tval('pron'));e(539189345,tval('phone'));e(2057429845,tval('postal'));
  e(1378825228,A.elig);e(1977569104,A.avail);e(2059869597,tval('travel'));
  DAYS.forEach(([d,id])=>(A.sched[d]||[]).forEach(v=>e(id,v)));
  e(1797070652,areasText());e(786066266,tval('concept'));
  if(A.phase==='__other'){p.append('entry.1950547007','__other_option__');p.append('entry.1950547007.other_option_response',tval('phaseOther'))}else e(1950547007,A.phase);
  e(215536326,nextText());e(1418563181,tval('goal'));e(1832957645,kitText('have','haveX'));e(633383745,kitText('need','needX'));e(483652490,tval('port'));
  e(341137160,tval('prior'));e(541153319,tval('ideal'));e(369678446,A.mtype);e(1917153289,A.fmt);e(105292208,tval('needs'));e(17454859,A.news);
  return p;
}
async function submit(){
  const missing=S.find(s=>s.kind&&!valid(s));
  if(missing){toast('One answer still needs you');return go(S.indexOf(missing))}
  const b=$('next');b.disabled=true;b.textContent='Sending…';
  const p=payload();p.append('fvv','1');p.append('pageHistory','0,1,2');
  try{
    await fetch(SHEET,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:p.toString()});
    sent=true;store.clear();go(S.length-1);
  }catch(err){
    b.disabled=false;b.textContent='Try sending again';
    const pre=payload();pre.append('usp','pp_url');
    $('fb').innerHTML=`<div class="fallback"><p><b>We couldn’t send it from here.</b> Your answers are saved on this device. You can try again, or open the Google Form with everything already filled in and press Submit there.</p><p style="margin-top:14px"><a class="btn" href="${FORM}viewform?${pre.toString()}" target="_blank" rel="noopener">Open the pre-filled form</a></p></div>`;
    $('fb').scrollIntoView({behavior:'smooth'});
  }
}

stage.addEventListener('input',ev=>{const k=ev.target.dataset.k;if(!k)return;A[k]=ev.target.value;ev.target.classList.remove('bad');store.set()});
stage.addEventListener('click',ev=>{
  const t=ev.target.closest('[data-act]');if(!t)return;const v=t.dataset.v,act=t.dataset.act;
  if(act==='start'){if(saved&&saved.i>0&&saved.i<S.length-1)return go(saved.i);return go(1)}
  if(act==='restart'){A={media:{},kit:{},paths:[],sched:{}};store.clear();return go(1)}
  if(act==='pick'){A[t.dataset.k]=v;render();if(S[i].kind==='choice')setTimeout(()=>{if(S[i].k===t.dataset.k)next()},260);if(v==='__other')$('f-phaseOther')?.focus();return}
  if(act==='fill'){const k=t.dataset.k,cur=(A[k]||'').trim();if(t.dataset.multi&&cur&&!cur.includes(v))A[k]=cur.replace(/[,.\s]+$/,'')+', '+v;else if(!cur.includes(v))A[k]=cur?cur+'\n'+v:v;const el=$('f-'+k);if(el){el.value=A[k];el.classList.remove('bad');el.focus()}store.set();return}
  if(act==='slot'){const d=t.dataset.d;let l=A.sched[d]||[];const no="Doesn't work for me";if(l.includes(v))l=l.filter(x=>x!==v);else l=v===no?[no]:[...l.filter(x=>x!==no),v];A.sched[d]=l;render();return}
  if(act==='copymon'){const m=A.sched.Monday||[];if(!m.length)return toast('Choose Monday first');DAYS.forEach(([d])=>A.sched[d]=[...m]);render();return toast('Copied to every day')}
  if(act==='media'){A.media[v]=((A.media[v]||0)+1)%3;render();return}
  if(act==='kit'){A.kit[v]=A.kit[v]==='have'?'need':A.kit[v]==='need'?undefined:'have';render();return}
  if(act==='path'){A.paths=A.paths.includes(v)?A.paths.filter(x=>x!==v):[...A.paths,v];render();return}
  if(act==='goto'){A._return=S.findIndex(s=>s.id==='review');return go(S.findIndex(s=>s.id===v))}
  if(act==='share'){const txt='I just applied to SPARKS, a no-cost mentorship for emerging storytellers in Calgary from Homegrown Arts & Media Collective. If you’ve got a project you want to make real, apply too.';try{navigator.clipboard.writeText(txt).then(()=>toast('Copied'),()=>toast('Couldn’t copy'))}catch(e){toast('Couldn’t copy')}return}
  if(act==='again'){A={media:{},kit:{},paths:[],sched:{}};sent=false;return go(0)}
});
stage.addEventListener('keydown',ev=>{if(ev.key!=='Enter')return;const tg=ev.target.tagName;if(tg==='INPUT'||(tg==='TEXTAREA'&&(ev.metaKey||ev.ctrlKey))){ev.preventDefault();next()}});
$('next').addEventListener('click',next);
$('back').addEventListener('click',()=>{delete A._return;go(i-1)});
render();
}
</script>
</body>
