<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NSWP Survey | Homegrown Arts &amp; Media Collective</title>
<meta name="theme-color" content="#2c3636">
<link rel="icon" href="assets/favicon.jpg">
<meta name="description" content="A short, anonymous survey to help shape the Nomad Social Work Project, mental health support built for Alberta's arts sector.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Karla:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* Homegrown / NSWP campaign creative tokens */
  :root{
    --bg:#2c3636; --shape:#3d4a4a; --card:#354242; --card-h:#3d4a4a; --line:#4c5b5b;
    --paper:#faf9f6; --ink:#faf9f6; --body:#dde1e1; --mut:#c9cfcf;
    --gold:#fcbc2e; --gold-h:#fdcf66; --on-gold:#2c2205; --heading-on-paper:#1f2626;
    --display:'Bricolage Grotesque','Helvetica Neue',system-ui,sans-serif;
    --text:Karla,'Helvetica Neue',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%}
  body{position:relative;background:var(--bg);color:var(--body);font-family:var(--text);-webkit-font-smoothing:antialiased;line-height:1.5;overflow-x:hidden}
  .shapes{position:absolute;inset:0;pointer-events:none;z-index:0;overflow:hidden}
  .shapes svg{position:absolute}
  .shapes .tl{left:0;top:0;width:min(62vw,440px);height:auto}
  .shapes .br{right:0;bottom:0;width:min(30vw,220px);height:auto}
  .app{position:relative;z-index:1;max-width:580px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding:20px 22px 24px}
  .top{display:flex;align-items:center;gap:14px;min-height:40px}
  .brand{text-decoration:none;font:700 13px var(--text);letter-spacing:.09em;text-transform:uppercase;color:var(--mut);white-space:nowrap}
  .steps{flex:1;font:500 13px var(--text);color:var(--mut);text-align:right}
  .bar{height:6px;background:var(--shape);border-radius:9px;overflow:hidden;margin:6px 0 4px}
  .bar i{display:block;height:100%;width:0;background:var(--gold);border-radius:9px;transition:width .4s ease}
  .stage{flex:1;display:flex;flex-direction:column;justify-content:center;padding:22px 0 12px}
  .screen{animation:in .35s ease both}
  @keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  .kicker{font:700 12.5px var(--text);letter-spacing:.09em;text-transform:uppercase;color:var(--mut);margin-bottom:14px}
  h1,h2{font-family:var(--display);font-weight:800;color:var(--ink);letter-spacing:-.025em;line-height:1.06}
  h1{font-size:clamp(40px,11vw,60px)}
  h2{font-size:clamp(28px,7.4vw,38px);margin-bottom:10px}
  h3{font:700 12.5px var(--text);letter-spacing:.09em;text-transform:uppercase;color:var(--mut);margin:24px 0 10px}
  mark{background:var(--gold);color:var(--on-gold);padding:0 .14em;border-radius:6px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
  mark.paper{background:var(--paper);color:var(--heading-on-paper)}
  .sub{color:var(--body);font-size:18px;line-height:1.5;margin:18px 0 22px;max-width:44ch}
  .hint{color:var(--body);font-size:16px;margin-bottom:18px}
  .badge{width:104px;height:104px;margin-bottom:22px;display:block}
  ul.promise{list-style:none;display:grid;gap:10px;margin:0 0 28px}
  ul.promise li{display:flex;gap:12px;align-items:flex-start;font-size:16.5px;color:var(--body)}
  ul.promise li::before{content:"";flex:none;width:10px;height:10px;border-radius:50%;background:var(--gold);margin-top:7px}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;background:transparent;color:var(--ink);border:2.5px solid var(--paper);border-radius:999px;font:700 17px var(--text);padding:14px 28px;min-height:52px;cursor:pointer;text-decoration:none;transition:background .15s,color .15s}
  .btn svg{width:20px;height:20px;flex:none}
  .btn:hover{background:var(--paper);color:var(--heading-on-paper)}
  .btn.gold{background:var(--gold);border-color:var(--gold);color:var(--on-gold)}
  .btn.gold:hover{background:var(--gold-h);border-color:var(--gold-h)}
  .btn.block{width:100%}
  :focus-visible{outline:3px solid var(--gold);outline-offset:3px}
  .chips{display:flex;flex-wrap:wrap;gap:9px}
  .chip{background:var(--card);border:1.5px solid var(--line);color:var(--ink);border-radius:999px;padding:11px 17px;min-height:46px;font:500 15.5px var(--text);cursor:pointer;transition:border-color .15s,background .15s,color .15s}
  .chip:hover{border-color:var(--mut)}
  .chip[aria-pressed="true"]{background:var(--paper);border-color:var(--paper);color:var(--heading-on-paper);font-weight:700}
  .opts{display:grid;gap:9px}
  .opt{text-align:left;background:var(--card);border:1.5px solid var(--line);color:var(--ink);border-radius:18px;padding:15px 18px;min-height:52px;font:500 16.5px var(--text);cursor:pointer;transition:border-color .15s,background .15s,color .15s}
  .opt:hover{border-color:var(--mut);background:var(--card-h)}
  .opt[aria-checked="true"]{background:var(--paper);border-color:var(--paper);color:var(--heading-on-paper);font-weight:700}
  .row{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:13px 15px;margin-bottom:9px}
  .row .lbl{font:700 16px var(--text);color:var(--ink);margin-bottom:10px}
  .seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
  .seg button{border:1.5px solid var(--line);background:var(--bg);color:var(--body);border-radius:999px;padding:9px 4px;min-height:44px;font:500 14.5px var(--text);cursor:pointer}
  .seg button:hover{border-color:var(--mut)}
  .seg button[aria-checked="true"]{border-color:var(--paper);background:var(--paper);color:var(--heading-on-paper);font-weight:700}
  .seg button[aria-checked="true"][data-v="2"]{background:var(--gold);border-color:var(--gold);color:var(--on-gold)}
  .tok{display:flex;align-items:center;gap:10px;background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:10px 12px;margin-bottom:9px}
  .tok .l{flex:1;font-size:15.5px;font-weight:500;color:var(--ink)}
  .tok button{width:42px;height:42px;border-radius:50%;border:2px solid var(--line);background:transparent;color:var(--ink);font:700 20px var(--text);cursor:pointer}
  .tok button:hover{border-color:var(--paper)}
  .dots{display:flex;gap:4px;min-width:62px;justify-content:center}
  .dots i{width:11px;height:11px;border-radius:50%;background:var(--gold)}
  .pool{display:flex;gap:6px;align-items:center;margin-bottom:14px;font:700 14px var(--text);color:var(--mut)}
  .pool i{width:16px;height:16px;border-radius:50%;background:var(--gold)}
  .pool i.off{background:var(--shape)}
  .pair{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:10px}
  .pair .opt{text-align:center;font-family:var(--display);font-weight:700;font-size:18px;padding:20px 8px;letter-spacing:-.01em}
  textarea{width:100%;min-height:140px;background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:15px;font:16.5px/1.5 var(--text);color:var(--ink);resize:vertical}
  textarea::placeholder{color:#9ba7a7}
  textarea:focus{border-color:var(--gold);outline:none;box-shadow:0 0 0 3px rgba(252,188,46,.45)}
  .note{font-size:14.5px;color:var(--mut);margin-top:12px}
  .actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:24px}
  .skip{background:none;border:0;color:var(--mut);font:500 15px var(--text);text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:12px 6px;min-height:44px}
  .skip:hover{color:var(--ink)}
  .back{align-self:flex-start;background:none;border:0;color:var(--mut);font:500 15px var(--text);cursor:pointer;padding:10px 2px;min-height:44px}
  .back:hover{color:var(--ink)}
  .back[hidden]{display:none}
  .sum{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:14px 17px;margin-bottom:10px;font-size:15.5px;color:var(--body)}
  .sum b{font:700 12.5px var(--text);letter-spacing:.09em;text-transform:uppercase;color:var(--mut);display:block;margin-bottom:3px}
  .heavy{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 18px}
  .heavy span{background:var(--gold);color:var(--on-gold);border-radius:999px;padding:8px 15px;font-size:15px;font-weight:700}
  .help{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-top:22px;padding-top:16px;border-top:1px solid var(--line)}
  .help p{font-size:14px;line-height:1.45;color:var(--mut);max-width:34ch}
  .help b{color:var(--ink)}
  .help img{width:132px;height:auto;flex:none;opacity:.95}
  .sr{position:absolute;left:-9999px}
  h1[tabindex="-1"]:focus,h2[tabindex="-1"]:focus{outline:none}
  @media (max-width:520px){.help{padding-right:min(30vw,128px);padding-bottom:6px}.help img{display:none}}
  @media (prefers-reduced-motion:reduce){.screen{animation:none}.bar i{transition:none}}
</style>
</head>
<body>
<div class="shapes" aria-hidden="true"><svg class="tl" viewBox="0 0 640 200"><path d="M0 0 H640 C560 150 410 215 250 190 C130 171 50 130 0 95 Z" fill="#3d4a4a"/></svg><svg class="br" viewBox="705 1090 375 260"><path d="M1080 1350 V1090 C990 1075 880 1115 800 1215 C765 1260 735 1310 705 1350 Z" fill="#faf9f6"/></svg></div>
<div class="app">
  <div class="top">
    <a class="brand" href="nswp">Nomad Social Work Project</a>
    <div class="steps" id="stepTxt" aria-live="polite"></div>
  </div>
  <div class="bar" aria-hidden="true"><i id="prog"></i></div>
  <button class="back" id="back" hidden>← Back</button>
  <main class="stage" id="stage"></main>
  <footer class="help"><p>In distress right now? Call or text <b>9-8-8</b>, the Suicide Crisis Helpline. For other services in Alberta, dial <b>2-1-1</b>.</p><img src="assets/homegrown-logo-white.png" alt="Homegrown Arts &amp; Media Collective"></footer>
</div>

<script>
(function(){
  // Paste your Google Apps Script Web App URL here (see apps-script.gs). Leave empty to disable saving.
  var ENDPOINT="https://script.google.com/macros/s/AKfycbxLAMS7jUkahQIjKBloi7a_0Qnh1mBy0uiw8kgAIMnqk3JLFVbsIjrRro4JnmZCMDkP/exec";
  var PROGRAM_FORM="https://forms.gle/gr8NCKwA4mzma2Qk9";
  // Paste the "Book a one-on-one" link used in the campaign creative. Leave empty to hide that button.
  var BOOKING="";
  var ARROW='<svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';

  var ROLES=["Independent artist","Arts administrator","Emerging artist or student","Other arts worker"];
  var DISC=["Film / video","Animation","Media arts","Music / audio","Visual art","Writing","Performance","Something else"];
  var REGION=["Calgary area","Edmonton area","Red Deer / Central Alberta","Another city or town","Rural or remote","Outside Alberta"];
  var IDS=["Indigenous","Francophone","Living with a disability","2SLGBTQ+"];
  var LOAD=[["income","Unpredictable income"],["deadlines","Grant and project deadlines"],["isolation","Working alone or feeling isolated"],["burnout","Burnout or running on empty"],["benefits","No benefits or safety net"],["block","Creative blocks or self-doubt"],["critique","Pressure from audiences or critique"]];
  var HISTORY=["Yes, and it helped","Yes, but it wasn't a good fit","I wanted to but didn't","I haven't needed it"];
  var BARRIERS=["Cost","Long wait times","Providers who don't understand creative work","Not knowing where to start","Stigma","Not feeling culturally safe","Language","Distance or transportation","Irregular schedule","Worry about privacy"];
  var FEATS=[["dropin","Drop-in community hours"],["oneonone","One-on-one sessions with a social worker"],["workshops","Wellness workshops"],["training","Certified training (like Mental Health First Aid)"],["peers","Peer circles, in person or online"],["guide","A guide to services that understand arts work"]];
  var PAIRS=[["place","In person","Online"],["time","Daytime","Evening"],["group","In a group","One-on-one"]];
  var SAFE=["Fully confidential","Non-clinical, plain language","Someone who understands arts work","Culturally safe and Indigenous-informed","2SLGBTQ+ affirming","Available in French","Accessible formats","Free or low cost","Flexible, last-minute scheduling"];

  var STEPS=["intro","about","where","load","barriers","build","format","safe","note","review","thanks"];
  var N=STEPS.length-2; // counted steps: about..review = 8
  var st={roles:[],disc:[],region:"",ids:[],load:{},history:"",barriers:[],tokens:{},fmt:{},safe:[],note:""};
  var i=0, sent=false;
  var stage=document.getElementById("stage"),prog=document.getElementById("prog"),
      back=document.getElementById("back"),stepTxt=document.getElementById("stepTxt");

  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
  function has(a,v){return a.indexOf(v)>-1}
  function toggle(a,v){var k=a.indexOf(v);if(k>-1)a.splice(k,1);else a.push(v)}

  function chips(list,sel,key){
    return '<div class="chips" data-key="'+key+'">'+list.map(function(v){
      return '<button type="button" class="chip" aria-pressed="'+has(sel,v)+'" data-v="'+esc(v)+'">'+esc(v)+'</button>'}).join("")+'</div>';
  }
  function bindChips(key,arr){
    var el=stage.querySelector('[data-key="'+key+'"]'); if(!el)return;
    el.addEventListener("click",function(e){
      var b=e.target.closest(".chip"); if(!b)return;
      toggle(arr,b.getAttribute("data-v"));
      b.setAttribute("aria-pressed",has(arr,b.getAttribute("data-v")));
    });
  }
  function frame(kicker,title,hint,body,nextLabel){
    return '<div class="screen"><div class="kicker">'+kicker+'</div><h2>'+title+'</h2>'+(hint?'<p class="hint">'+hint+'</p>':'')+body+
      '<div class="actions"><button class="btn" id="next" type="button">'+(nextLabel||"Next")+ARROW+'</button><button class="skip" id="skip" type="button">Skip this one</button></div></div>';
  }
  function wire(){
    var n=document.getElementById("next"),s=document.getElementById("skip");
    if(n)n.onclick=function(){go(i+1)};
    if(s)s.onclick=function(){go(i+1)};
  }

  function go(n){
    i=n; render();
    var k=Math.max(0,Math.min(i,N+1));
    prog.style.width=(k/(N+1)*100)+"%";
    stepTxt.textContent=(i>=1&&i<=N)?("Step "+i+" of "+N):"";
    back.hidden=(i===0||i===STEPS.length-1);
    window.scrollTo(0,0);
    var h=stage.querySelector("h1,h2"); if(h){h.setAttribute("tabindex","-1");try{h.focus({preventScroll:true})}catch(e){}}
  }
  back.onclick=function(){if(i>0)go(i-1)};

  function render(){
    var s=STEPS[i];
    if(s==="intro"){
      stage.innerHTML='<div class="screen"><img class="badge" src="assets/nswp-badge.png" alt="The Nomad Social Work Project badge" width="104" height="104">'+
        '<div class="kicker">Tell us what you need</div>'+
        '<h1>Your answers <mark>decide</mark> what gets built.</h1>'+
        '<p class="sub">The Nomad Social Work Project is a new support program being built for Alberta\'s arts sector. This is how artists and arts workers shape it, before anything is built.</p>'+
        '<ul class="promise"><li>Anonymous. No name, no email.</li><li>Skip any question you don\'t want to answer.</li><li>About 5 minutes, and it works on your phone.</li></ul>'+
        '<div class="actions" style="margin-top:0"><button class="btn gold" id="start" type="button">Take the survey'+ARROW+'</button>'+
        (BOOKING?'<a class="btn" href="'+BOOKING+'" target="_blank" rel="noopener">Book a one-on-one'+ARROW+'</a>':'')+'</div>'+
        '<p class="note">This is a survey, not a counselling service. If you\'re in distress right now, the numbers at the bottom of the page are there 24/7.</p></div>';
      document.getElementById("start").onclick=function(){go(1)};
      return;
    }
    if(s==="about"){
      stage.innerHTML=frame("About you","Which of these sound <mark>like you</mark>?","Pick any that fit.",
        chips(ROLES,st.roles,"roles")+'<h3>What do you work in?</h3>'+chips(DISC,st.disc,"disc"));
      bindChips("roles",st.roles);bindChips("disc",st.disc);wire();return;
    }
    if(s==="where"){
      var ro='<div class="opts" role="radiogroup" aria-label="Region">'+REGION.map(function(v){
        return '<button type="button" class="opt" role="radio" aria-checked="'+(st.region===v)+'" data-v="'+esc(v)+'">'+esc(v)+'</button>'}).join("")+'</div>';
      stage.innerHTML=frame("Where you are","Where are you <mark class=\"paper\">based</mark>?","",ro+
        '<h3>Optional: do any of these describe you?</h3>'+chips(IDS,st.ids,"ids")+
        '<p class="note">Only used to check whether we\'re hearing from a wide range of voices. Never reported individually.</p>');
      stage.querySelector(".opts").onclick=function(e){
        var b=e.target.closest(".opt");if(!b)return;
        st.region=b.getAttribute("data-v");
        var all=stage.querySelectorAll(".opt");for(var k=0;k<all.length;k++)all[k].setAttribute("aria-checked",all[k]===b);
      };
      bindChips("ids",st.ids);wire();return;
    }
    if(s==="load"){
      var h="";
      LOAD.forEach(function(r){
        var v=st.load[r[0]];
        h+='<div class="row" role="radiogroup" aria-label="'+esc(r[1])+'"><div class="lbl">'+esc(r[1])+'</div><div class="seg">'+
          [["0","Not much"],["1","Some"],["2","A lot"]].map(function(o){
            return '<button type="button" role="radio" data-k="'+r[0]+'" data-v="'+o[0]+'" aria-checked="'+(String(v)===o[0])+'">'+o[1]+'</button>'}).join("")+'</div></div>';
      });
      stage.innerHTML=frame("Your load","What\'s the <mark>weather</mark> been like lately?","Tap how much each of these has weighed on you recently. There are no right answers.",h);
      stage.addEventListener("click",loadHandler);
      wire();return;
    }
    if(s==="barriers"){
      var hs='<div class="opts" role="radiogroup" aria-label="Looked for support before">'+HISTORY.map(function(v){
        return '<button type="button" class="opt" role="radio" aria-checked="'+(st.history===v)+'" data-v="'+esc(v)+'">'+esc(v)+'</button>'}).join("")+'</div>';
      stage.innerHTML=frame("Getting support","Have you ever looked for <mark class=\"paper\">support</mark>?","",hs+
        '<h3>What tends to get in the way? Pick any.</h3>'+chips(BARRIERS,st.barriers,"barriers"));
      stage.querySelector(".opts").onclick=function(e){
        var b=e.target.closest(".opt");if(!b)return;
        st.history=b.getAttribute("data-v");
        var all=stage.querySelectorAll(".opt");for(var k=0;k<all.length;k++)all[k].setAttribute("aria-checked",all[k]===b);
      };
      bindChips("barriers",st.barriers);wire();return;
    }
    if(s==="build"){
      stage.innerHTML=frame("Build the program","You have 5 tokens. What should NSWP <mark>include</mark>?","Add tokens to what matters most. You don\'t have to spend them all.",
        '<div class="pool" id="pool"></div><div id="tl"></div>');
      drawTokens();wire();return;
    }
    if(s==="format"){
      var ph="";
      PAIRS.forEach(function(p){
        ph+='<div class="pair" role="radiogroup" aria-label="'+esc(p[1]+" or "+p[2])+'">'+
          [p[1],p[2]].map(function(l){return '<button type="button" class="opt" role="radio" data-k="'+p[0]+'" data-v="'+esc(l)+'" aria-checked="'+(st.fmt[p[0]]===l)+'">'+esc(l)+'</button>'}).join("")+'</div>';
      });
      stage.innerHTML=frame("This or that","What would you <mark>actually</mark> show up for?","Three quick ones.",ph);
      stage.addEventListener("click",pairHandler);
      wire();return;
    }
    if(s==="safe"){
      stage.innerHTML=frame("Feeling safe","What would help you feel <mark class=\"paper\">safe</mark>?","Pick any.",chips(SAFE,st.safe,"safe"));
      bindChips("safe",st.safe);wire();return;
    }
    if(s==="note"){
      stage.innerHTML=frame("Last thing","Anything you want the team to <mark>know</mark>?","Optional. Please don\'t include your name or contact details.",
        '<label class="sr" for="nt">Your note</label><textarea id="nt" maxlength="1200" placeholder="What would make support feel possible for you?">'+esc(st.note)+'</textarea>'+
        '<p class="note">Notes are read in batches, not in real time. If you need support now, call or text 9-8-8.</p>',"Review");
      var t=document.getElementById("nt");t.oninput=function(){st.note=t.value};wire();return;
    }
    if(s==="review"){renderReview();return}
    if(s==="thanks"){renderThanks();return}
  }

  function loadHandler(e){
    var b=e.target.closest(".seg button");if(!b||i!==3)return;
    var k=b.getAttribute("data-k"),v=parseInt(b.getAttribute("data-v"),10);
    st.load[k]=v;
    var sibs=b.parentNode.children;for(var j=0;j<sibs.length;j++)sibs[j].setAttribute("aria-checked",sibs[j]===b);
  }
  function pairHandler(e){
    var b=e.target.closest(".pair .opt");if(!b||i!==6)return;
    st.fmt[b.getAttribute("data-k")]=b.getAttribute("data-v");
    var sibs=b.parentNode.children;for(var j=0;j<sibs.length;j++)sibs[j].setAttribute("aria-checked",sibs[j]===b);
  }

  function spent(){var t=0;for(var k in st.tokens)t+=st.tokens[k];return t}
  function drawTokens(){
    var left=5-spent(),p="";
    for(var k=0;k<5;k++)p+='<i class="'+(k<left?"":"off")+'"></i>';
    document.getElementById("pool").innerHTML=p+'<span style="margin-left:4px">'+left+' left</span>';
    var h="";
    FEATS.forEach(function(f){
      var n=st.tokens[f[0]]||0,d="";for(var k=0;k<n;k++)d+="<i></i>";
      h+='<div class="tok"><div class="l">'+esc(f[1])+'</div><button type="button" data-k="'+f[0]+'" data-d="-1" aria-label="Remove a token from '+esc(f[1])+'">−</button><div class="dots" aria-label="'+n+' tokens">'+d+'</div><button type="button" data-k="'+f[0]+'" data-d="1" aria-label="Add a token to '+esc(f[1])+'">+</button></div>';
    });
    var tl=document.getElementById("tl");tl.innerHTML=h;
    tl.onclick=function(e){
      var b=e.target.closest("button");if(!b)return;
      var key=b.getAttribute("data-k"),d=parseInt(b.getAttribute("data-d"),10),cur=st.tokens[key]||0;
      if(d>0&&spent()>=5)return;if(d<0&&cur<=0)return;
      st.tokens[key]=cur+d;drawTokens();
    };
  }

  function heavyList(){
    var out=[];LOAD.forEach(function(r){if(st.load[r[0]]===2)out.push(r[1])});return out;
  }

  function renderReview(){
    var parts=[];
    if(st.roles.length)parts.push(["You",st.roles.join(", ")]);
    if(st.region)parts.push(["Region",st.region]);
    var top=FEATS.filter(function(f){return (st.tokens[f[0]]||0)>0}).sort(function(a,b){return st.tokens[b[0]]-st.tokens[a[0]]}).slice(0,3).map(function(f){return f[1]});
    if(top.length)parts.push(["You backed",top.join(" · ")]);
    if(st.barriers.length)parts.push(["Barriers",st.barriers.length+" selected"]);
    if(st.safe.length)parts.push(["Feeling safe",st.safe.length+" selected"]);
    var sum=parts.length?parts.map(function(p){return '<div class="sum"><b>'+esc(p[0])+'</b>'+esc(p[1])+'</div>'}).join(""):'<div class="sum">You skipped everything. That\'s okay. You can still send, or go back and answer a few.</div>';
    stage.innerHTML='<div class="screen"><div class="kicker">Ready when you are</div><h2>Here\'s what you\'re <mark>sending</mark>.</h2>'+
      '<p class="hint">Nothing is sent until you tap the button. Answers are anonymous.</p>'+sum+
      '<div class="actions"><button class="btn gold" id="send" type="button">Send my answers'+ARROW+'</button></div>'+
      '<p class="note">Want to change something? Use Back.</p></div>';
    document.getElementById("send").onclick=function(){submit();go(STEPS.length-1)};
  }

  function submit(){
    if(sent)return;sent=true;
    var d=new Date(),day=d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2);
    var p={submitted_date:day,roles:st.roles,disciplines:st.disc,region:st.region,identities:st.ids,
      load:st.load,support_history:st.history,barriers:st.barriers,tokens:st.tokens,
      format:st.fmt,safety:st.safe,note:st.note};
    try{console.log("NSWP response",JSON.stringify(p))}catch(e){}
    if(!ENDPOINT)return;
    try{fetch(ENDPOINT,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(p)}).catch(function(){})}catch(e){}
  }

  function renderThanks(){
    var hv=heavyList();
    var mirror=hv.length?('<p class="hint">You said these have weighed a lot lately:</p><div class="heavy">'+hv.map(function(x){return '<span>'+esc(x)+'</span>'}).join("")+'</div><p class="sub" style="margin-top:0">You\'re not the only one carrying these. They\'re exactly what NSWP is being designed around.</p>')
      :'<p class="sub">Your answers help us design support around what the arts community actually needs.</p>';
    stage.innerHTML='<div class="screen"><div class="kicker">Thank you</div><h2>You just helped <mark>shape</mark> NSWP.</h2>'+mirror+
      '<div class="opts" style="margin-top:6px">'+
      (BOOKING?'<a class="btn gold block" href="'+BOOKING+'" target="_blank" rel="noopener">Book a one-on-one'+ARROW+'</a>':'')+
      '<a class="btn block" href="'+PROGRAM_FORM+'" target="_blank" rel="noopener">Interested in using NSWP? Tell us here'+ARROW+'</a>'+
      '</div><p class="note">That form is separate from this survey, so your answers here stay anonymous.</p>'+
      '<p class="note">Know someone in the arts who should weigh in? Send them this page.</p></div>';
  }

  go(0);
})();
</script>
</body>
</html>
